name: test
on:
  push:
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: node run.js

  # shared/rules.js e o copie a regulilor din urnotes-api: pică dacă serverul le-a schimbat și copia a rămas în urmă.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-rules.mjs --check
        env:
          URNOTES_API_TOKEN: ${{ secrets.URNOTES_API_TOKEN }}
